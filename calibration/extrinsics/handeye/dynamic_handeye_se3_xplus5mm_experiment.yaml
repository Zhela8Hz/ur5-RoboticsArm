# Experiment-only configuration: virtual -5 mm Y injection in tool frame.
# Dynamic SE(3) hand-eye correction. X0 is never written by this program.
interfaces:
  image_topic: /camera/color/image_raw
  tf_topic: /tf
  base_frame: base
  tool_frame: tool0
  camera_frame: camera_color_optical_frame
  board_frame: charuco_board
  expected_clock_domain: ros
paths:
  intrinsics: calibration/rgb_intrinsics/results/rgb_intrinsics_gemini335_1920x1080.yaml
  original_handeye: calibration/extrinsics/handeye/handeye_tool0_camera_color_optical.yaml
  output_root: calibration/extrinsics/handeye/sessions
  self_test_report: calibration/extrinsics/handeye/dynamic_handeye_se3_self_test_report.yaml
board:
  squares_x: 6
  squares_y: 6
  square_length_m: 0.040
  marker_length_m: 0.030
  dictionary_id: DICT_6X6_1000
  start_id: 233
quality:
  min_charuco_corners: 20
  max_reprojection_rms_px: 1.0
  min_laplacian_variance: 80.0
  min_edge_margin_px: 12
sync:
  ideal_max_time_error_sec: 0.005
  optimize_max_time_error_sec: 0.010
  save_only_max_time_error_sec: 0.020
  tf_history_sec: 10.0
live:
  # Keep only the latest camera image. A missing TF must never grow memory.
  image_queue_depth: 1
  # ChArUco and PNG I/O run in this process; status is printed to the terminal.
  max_process_rate_hz: 5.0
  max_status_rate_hz: 2.0
  # ROS callbacks must keep up with /tf independently of terminal output.
  max_ros_spin_rate_hz: 100.0
  # Keep a detected image until the corresponding future TF arrives.
  max_tf_wait_sec: 1.5
  # Fail before opening a GUI when base -> tool0 is unavailable.
  startup_tf_timeout_sec: 5.0
motion:
  # Dynamic sampling accepts synchronized frames while the trajectory moves.
  max_tcp_linear_speed_m_s: 0.030
  max_tcp_angular_speed_deg_s: 3.0
  max_linear_acceleration_m_s2: 0.10
  max_angular_acceleration_deg_s2: 20.0
  # Ignore arbitrary direction from sub-millimetre stationary TF noise.
  direction_change_min_translation_m: 0.0005
  direction_change_cosine_min: -0.25
selection:
  min_new_translation_m: 0.0005
  min_new_rotation_deg: 0.1
  near_duplicate_translation_m: 0.00025
  near_duplicate_rotation_deg: 0.05
optimization:
  # translation_only is the safe default; use full_se3 only after translation tests pass.
  mode: translation_only
  loss: huber                 # linear or huber
  huber_f_scale_m: 0.001
  rotation_weight_m_per_rad: 0.05
  # The pose-2-to-5 procedure provides four distinct poses.
  min_samples: 4
  update_every_valid_samples: 4
  max_translation_m: 0.020
  max_rotation_deg: 5.0
  max_nfev: 300
  jacobian_rank_tolerance: 1.0e-8
  min_jacobian_rank: 3
  max_condition_number: 1.0e10
  # Set to a 4x4 matrix only when a trustworthy base->board transform is known.
  known_base_board_matrix: null
validation:
  # Every fourth accepted motion sample is never fitted; it is holdout-only.
  holdout_every_n_samples: 4
  min_holdout_samples: 4
  max_condition_number: 500.0
  max_holdout_rms_m: 0.001
  max_after_before_ratio: 0.8
  max_update_translation_m: 0.001
  max_update_rotation_deg: 0.2
  required_stable_updates: 2
storage:
  # Raw 1920x1080 PNG at 30 fps can saturate CPU and storage.
  save_all_images: false
  save_annotated_images: false
  image_extension: png
injection:
  enabled: true
  translation_mm: [0.0, -5.0, 0.0]
  rotation_rotvec_deg: [0.0, 0.0, 0.0]
  frame: tool
  multiplication: left
apply:
  publish_tf: false
  overwrite_original_handeye: false
